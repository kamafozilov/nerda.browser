<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="0.55" stop-color="#7A33EE"/>
      <stop offset="1" stop-color="#E23F92"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD6FF"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A0A5E" flood-opacity="0.35"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3B0F80" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Tile, with the shadow macOS icons sit on -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- An orbit around the letter: the web -->
    <ellipse cx="512" cy="512" rx="330" ry="130" transform="rotate(-28 512 512)"
             fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="18"/>
    <circle cx="786" cy="330" r="26" fill="#fff" fill-opacity="0.9"/>
  </g>

  <!-- The N: two bars and a ribbon folded between them -->
  <g filter="url(#soft)">
    <rect x="318" y="300" width="124" height="424" rx="62" fill="#fff"/>
    <rect x="582" y="300" width="124" height="424" rx="62" fill="#fff"/>
  </g>
  <line x1="380" y1="362" x2="644" y2="662" stroke="url(#fold)" stroke-width="124" stroke-linecap="round" filter="url(#lift)"/>
</svg>
