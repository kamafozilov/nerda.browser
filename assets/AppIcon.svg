<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- No SVG filters: sips, which renders this in build.sh, ignores them.
       Shadows are stacked translucent copies instead. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA2FF"/>
      <stop offset="0.55" stop-color="#2F5BEA"/>
      <stop offset="1" stop-color="#1B2A8F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E8FF"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Tile, on Apple's icon grid, with the shadow macOS icons sit on -->
  <g fill="#000">
    <rect x="96" y="108" width="832" height="832" rx="189" opacity="0.05"/>
    <rect x="98" y="106" width="828" height="828" rx="187" opacity="0.07"/>
    <rect x="100" y="104" width="824" height="824" rx="185" opacity="0.1"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- An orbit around the letter: the web -->
    <ellipse cx="512" cy="512" rx="330" ry="130" transform="rotate(-28 512 512)"
             fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="18"/>
    <circle cx="786" cy="330" r="26" fill="#fff" fill-opacity="0.9"/>

    <!-- The bars' shadow -->
    <g fill="#0A1850">
      <rect x="306" y="312" width="148" height="436" rx="74" opacity="0.06"/>
      <rect x="570" y="312" width="148" height="436" rx="74" opacity="0.06"/>
      <rect x="312" y="310" width="136" height="428" rx="68" opacity="0.08"/>
      <rect x="576" y="310" width="136" height="428" rx="68" opacity="0.08"/>
    </g>
  </g>

  <!-- The N: two bars and a ribbon folded over them -->
  <rect x="318" y="300" width="124" height="424" rx="62" fill="#fff"/>
  <rect x="582" y="300" width="124" height="424" rx="62" fill="#fff"/>
  <line x1="380" y1="374" x2="644" y2="674" stroke="#0A1850" stroke-width="144" stroke-linecap="round" opacity="0.06"/>
  <line x1="380" y1="370" x2="644" y2="670" stroke="#0A1850" stroke-width="134" stroke-linecap="round" opacity="0.1"/>
  <line x1="380" y1="366" x2="644" y2="666" stroke="#0A1850" stroke-width="126" stroke-linecap="round" opacity="0.16"/>
  <line x1="380" y1="362" x2="644" y2="662" stroke="url(#fold)" stroke-width="124" stroke-linecap="round"/>
</svg>
